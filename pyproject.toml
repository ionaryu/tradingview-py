[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tradingview"
version = "4.0.0"
description = "TradingView market data for Python: candles, quotes, indicators and strategies, with a simple data API and full low-level access (Python port of @mathieuc/tradingview)."
readme = "README.md"
license = "ISC"
requires-python = ">=3.11"
authors = [
    { name = "Mathieu Colmon (Original JS/TS)" },
    { name = "Python Port Contributors" }
]
keywords = [
    "tradingview",
    "market-data",
    "candles",
    "quotes",
    "stocks",
    "crypto",
    "forex",
    "indicator",
    "pine",
    "websocket",
    "api"
]
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
]

[project.scripts]
tradingview = "tradingview.quick_start:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tradingview"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
